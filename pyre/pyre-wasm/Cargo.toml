[package]
name = "pyre-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "pyre Python interpreter compiled to WebAssembly"

[lib]
crate-type = ["cdylib"]

[features]
# No default: `web`/`wasmi` are selected explicitly (both build paths pass
# `--no-default-features --features <binding>`). Defaulting to `web` would
# pull `pyre-jit/wasm-web` into a host `cargo build/test --all` via feature
# unification and trip pyre-jit's non-wasm32 compile_error guard.
default = []
# Browser / JS host: `run_python` is exported through wasm-bindgen and the
# JIT instantiates trace modules via the `WebAssembly` API (`jit_glue.js`).
# The browser has no filesystem, so the stdlib `import re` needs is embedded
# and served from an in-memory VFS (`pyre-interpreter/wasm_vfs`).
web = [
    "dep:wasm-bindgen",
    "pyre-jit/wasm-web",
    "getrandom/wasm_js",
    "pyre-interpreter/wasm_vfs",
]
# Native (non-browser) wasm host, the counterpart to `web`: a plain C-ABI
# surface (`pyre_alloc` / `pyre_dealloc` / `pyre_run_python`) is exported and
# the JIT instantiates trace modules via plain wasm imports. No JavaScript. The
# embedding runtime (e.g. wasmtime or wasmi) is the host's choice and not fixed
# by this feature. getrandom uses its `custom` backend here (see the
# `__getrandom_v03_custom` shim in `src/lib.rs`), selected by building with
# `--cfg getrandom_backend="custom"`, so the module carries no wasm-bindgen
# imports a non-JS embedder could not satisfy.
wasm-host = ["pyre-jit/wasm-host", "dep:majit-backend", "dep:majit-backend-wasm", "dep:majit-metainterp", "dep:pyre-jit-trace"]
# Forwards `majit-gc/gc_stress` into the guest. Off by default so the
# shipping wasm-host module keeps its inline nursery bump; a stress run
# rebuilds with `--features wasm-host,gc_stress` and then opts in at
# runtime via `MAJIT_GC_STRESS` through `pyre_set_gc_env`.
gc_stress = ["pyre-jit/gc_stress"]
# Diagnostic only: install a counting global allocator so the host runner can
# read net-live guest-heap bytes/count (`pyre_heap_live_bytes` /
# `pyre_heap_live_count`) and split a true Rust-heap leak from fragmentation.
# Not part of any shipping build.
heap-prof = []

[dependencies]
pyre-object = { workspace = true }
pyre-interpreter = { workspace = true, features = ["host_env"] }
pyre-module = { workspace = true, features = ["host_env"] }
rustpython-wtf8 = { workspace = true }
# Specified directly (not via workspace inheritance) so default-features
# can be turned off — drops the native `dynasm` backend, which does not
# build for wasm32; on wasm32 the JIT backend is selected by target_arch.
# `prepass` is named because defaults are off: without it `pyre-jit-trace`'s
# build script emits placeholder JIT tables and refuses the build.
pyre-jit = { path = "../pyre-jit", version = "0.0.2", default-features = false, features = ["prepass", "pyre-module"] }
wasm-bindgen = { workspace = true, optional = true }
getrandom = { workspace = true }
# Only the `wasm-host` build installs `install_residual_host_call`, the host
# fallback for a callee with no single wasm function type or a host import
# outside the guest table. The `web` build does not install that hook.
majit-backend = { workspace = true, optional = true }
# Diagnostic-only: lets the `pyre_jit_bridge_diag` export read the wasm
# backend's `compile_bridge` outcome tallies (a static counter, not a host
# import, which would shift the JIT's function-index space).
majit-backend-wasm = { path = "../../majit/majit-backend-wasm", version = "0.0.2", optional = true, default-features = false }
majit-metainterp = { path = "../../majit/majit-metainterp", version = "0.0.2", optional = true, default-features = false }
# Diagnostic-only, same rationale: lets the `pyre_fbw_diag` export read the
# walker's per-walk census, the wasm target's only walk-level observability
# (the guest cannot read `PYRE_FBW_CENSUS`).
pyre-jit-trace = { path = "../pyre-jit-trace", version = "0.0.2", optional = true, default-features = false }
