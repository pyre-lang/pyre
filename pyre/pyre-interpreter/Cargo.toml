[package]
name = "pyre-interpreter"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Python bytecode interpreter for pyre"

[features]
default = ["host_env"]
host_env = ["dep:rustpython-host_env", "pyre-native/host_env", "majit-rlib/host_env"]
# Expose the crate-internal `test_hooks` module (thread-local dict hash-hook
# installer) to downstream test builds. Enabled by `pyre-jit`'s
# dev-dependency so its `#[test]`s — which drive interpreter frames through
# `init_typeobjects` without compiling this crate under `cfg(test)` — install
# the same single hash path production wires at boot. Off in every non-test
# build (dev-dependencies never participate there).
test-hooks = []
# RPython-style sandbox: `replace_os_function` / `replace_time_function`
# wrappers expand to marshalling trampolines. Implies host_env.
sandbox = ["host_env", "dep:pyre-sandbox", "pyre-native/sandbox", "majit-rlib/sandbox"]
# Load C extension modules built against pyre's own ABI. The build-time switch
# is upstream's: `has_so_extension` reads `config.objspace.usemodules.cpyext`
# (imp/importing.py:60) and gates `create_dynamic` (imp/interp_imp.py:49-51).
# Implies host_env — the loader is a host `dlopen` — and stays unavailable
# under `sandbox`, which exists to keep the process off exactly those calls.
#
# It also gates `extension_suffixes`, which upstream answers unconditionally
# (imp/interp_imp.py:11-15). Deliberate divergence: a suffix names a loader, so
# without one nothing on the import path should advertise it. The consequence
# is why the feature is off by default —
# `importlib._bootstrap_external.EXTENSION_SUFFIXES` is that call's result, and
# a non-empty list un-skips `test_importlib/extension`, whose tests load
# CPython's `_testsinglephase` / `_testmultiphase`. The ABI header pyre ships
# builds neither yet. See pyre/docs/cpyext.md.
cpyext = ["host_env"]
cranelift = ["majit-metainterp/cranelift"]
dynasm = ["majit-metainterp/dynasm"]
# Embed the pure-Python stdlib closure needed for `import re` into the binary
# and serve it from an in-memory VFS — the browser/web wasm target has no
# filesystem. Off by default; the native and wasmtime-runner targets read the
# real filesystem instead.
wasm_vfs = ["pyre-native/wasm_vfs", "host_env"]
# Collect on every allocation. Forwarded so interpreter-owned rooting tests
# can run under the same gate as `pyre-jit`.
gc_stress = ["majit-gc/gc_stress"]

[dependencies]
pyre-object = { workspace = true }
pyre-macros = { workspace = true }
pyre-native = { workspace = true }
# `#[pyre_class]` emits a `linkme::distributed_slice` element per type into
# `pyre_object::lltype::PYRE_CLASS_DESCRIPTORS`; the attribute path must resolve
# in this crate too.
linkme = { workspace = true }
# `Py_TPFLAGS_*` is one `unsigned long` an extension writes into, so the
# flags type stays `#[repr(transparent)]` over `c_ulong`; `Flags::FLAGS`
# is what lets the test below compare each one against the header that
# ships it.
bitflags = { workspace = true }
rustpython-wtf8 = { workspace = true }
rustpython-literal = { workspace = true }
rustpython-common = { workspace = true }
rustpython-unicode = { workspace = true }
majit-gc = { workspace = true }
majit-rlib = { workspace = true }
majit-ir = { workspace = true }
majit-macros = { workspace = true }
majit-metainterp = { workspace = true }
stacker = { workspace = true }
rustpython-compiler = { workspace = true }
rustpython-compiler-core = { workspace = true }
ruff-text-size = { workspace = true }
thin-vec = { workspace = true }
num-complex = { workspace = true }
malachite-bigint = { workspace = true }
num-traits = { workspace = true }
num-integer = { workspace = true }
pymath = { workspace = true }
sre-engine = { workspace = true }
rustpython-host_env = { workspace = true, optional = true }
pyre-sandbox = { workspace = true, optional = true }
libc = { workspace = true }
siphasher = { workspace = true }
getrandom = { workspace = true }
indexmap = { workspace = true }
paste = { workspace = true }
parking_lot = { workspace = true }
[target.'cfg(windows)'.dependencies]
# Remaining Windows FFI host_env does not wrap 1:1 (WinSock types).
# `not(host_env)` SEH still reads Foundation exception codes.
# Kept on the same 0.61 line rustpython-host_env's nt module resolves to, so
# HANDLE types match at the boundary.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Networking_WinSock",
    "Win32_Devices_Bluetooth",
    "Win32_System_Threading",
] }
# Builds the `WideCStr` key/value-name arguments the `rustpython_host_env::winreg`
# Reg* wrappers take. Same 1.x line host_env resolves to.
widestring = "1.2"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tempfile = { workspace = true }
# Resolver 2 does not unify this feature into a normal or release build.
pyre-object = { workspace = true, features = ["test-hooks"] }

# `type_object()` accessors publish their residual-call address through a
# `linkme` link section off wasm32.  wasm32 rejects that section — a custom
# `link_section` static there must be a plain byte list, and a descriptor
# holds two pointers — so the accessors register from a constructor instead.
[target.'cfg(target_arch = "wasm32")'.dependencies]
ctor = { workspace = true }
