[package]
name = "pyre-wasm-runner"
version.workspace = true
edition.workspace = true
publish = false
description = "Native wasmtime host that runs the wasm32 build of pyre, satisfying the JIT host-import contract"

[[bin]]
name = "pyre-wasm-runner"
path = "src/main.rs"

[dependencies]
majit-backend-wasm-host = { workspace = true }
parking_lot = { workspace = true }
bitflags = { workspace = true }
# wasmtime vendors its own error type (`wasmtime::Error`) and re-exports a
# `Context` trait, so the runner needs no separate `anyhow` dependency.
wasmtime = { workspace = true }
# Disassemble a trace module to WAT when it fails to compile, gated by
# PYRE_WASM_DUMP_BAD_TRACE — used to debug JIT codegen bugs. Pinned to the
# version wasmtime already resolves in the lockfile.
wasmprinter = "0.261"
# Resolve a function-table slot to its symbol for the PYRE_WASM_CALL_HIST
# probe, by reading the module's element and name sections. Pinned to the
# version wasmtime already resolves in the lockfile, as wasmprinter is.
wasmparser = "0.261"
# Render a resolved slot symbol the way the codebase cites one
# (`pyre_jit::call_jit::bh_call_fn`) rather than as its v0 mangling. Already in
# the lockfile as a wasmtime backtrace dependency.
rustc-demangle = "0.1"
# Pure-Rust wasm interpreter, the alternative `--engine wasmi` execution path.
# Unlike wasmtime it does not compile the module on load (near-zero fixed
# startup cost), at the price of slower steady-state execution.
wasmi = "1.1"
# Content hash binding the `.cwasm` cache to the exact `.wasm` bytes it was
# compiled from, so a stale or pre-placed cache is never deserialized.
sha2 = "0.10"
# The entropy `pyre_host.host_random` serves the guest. wasm32-unknown-unknown
# has no OS entropy, so the guest's `os.urandom` and `secrets` are this call.
getrandom = { workspace = true }
libc = { workspace = true }
mimalloc = { version = "0.1" }
wasmi_core = "1.1"
