[package]
name = "pyre-jit"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "JIT compiler integration for pyre interpreter"

[features]
default = ["dynasm", "prepass", "pyre-module"]
# The binary links `pyre-module`; the prepass then translates its modules too.
pyre-module = ["pyre-jit-trace/pyre-module"]
# `pyre-jit-trace`'s translation prepass. Forwarded rather than inherited
# through that dependency's defaults so an LLBC extraction pass of this crate
# (`--no-default-features --features dynasm`) can leave it off; every other
# build wants it, and a dependant that turns this crate's defaults off must
# name it (`pyre-wasm` does).
prepass = ["pyre-jit-trace/prepass"]
cranelift = ["majit-backend-cranelift", "majit-metainterp/cranelift", "pyre-jit-trace/cranelift"]
dynasm = ["majit-backend-dynasm", "majit-metainterp/dynasm", "pyre-jit-trace/dynasm"]
# Build opt-in majit audit instrumentation. Individual audits remain selected
# at runtime by their environment gates.
jit-audits = ["majit-metainterp/jit-audits", "majit-ir/jit-audits"]
# Collect on every allocation so instance / container GC tracing is
# exercised eagerly. majit-gc is compiled once per build, so this single
# edge enables the stress mode for the whole pyre-jit dependency closure.
gc_stress = ["majit-gc/gc_stress"]
# Keep JIT-side module references in lockstep with the interpreter's sandbox
# surface.  In particular, native networking modules such as `_ssl` are
# compiled out of pyre-interpreter under this feature.
sandbox = ["pyre-interpreter/sandbox", "pyre-jit-trace/sandbox"]
# Select the host binding for the wasm backend (only meaningful on
# wasm32). `wasm-web` instantiates JIT traces through the browser
# `WebAssembly` API; `wasm-host` through plain wasm imports a native
# embedder (wasmi / wasmtime) supplies.
wasm-web = ["majit-backend-wasm/web"]
wasm-host = ["majit-backend-wasm/host-import"]

[dependencies]
parking_lot = { workspace = true }
indexmap = { workspace = true }
rustc-hash = { workspace = true }
pyre-object = { workspace = true }
pyre-interpreter = { workspace = true, features = ["host_env"] }
num-traits = { workspace = true }
linkme = { workspace = true }
majit-ir = { workspace = true }
majit-macros = { workspace = true }
majit-metainterp = { workspace = true }
majit-jitcode = { workspace = true }
majit-backend = { workspace = true }
majit-trace = { workspace = true }
majit-gc = { workspace = true }
majit-rlib = { workspace = true }
pyre-jit-trace = { workspace = true }
majit-backend-cranelift = { workspace = true, optional = true }
majit-backend-dynasm = { workspace = true, optional = true }
vecset = { workspace = true }
bit-set = { workspace = true }
rustpython-wtf8 = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
ctor = { workspace = true }
# Specified directly (not via workspace inheritance) so default-features
# can be turned off — the host binding (web vs host-import) is chosen
# explicitly through pyre-jit's `wasm-web` / `wasm-host` features.
majit-backend-wasm = { path = "../../majit/majit-backend-wasm", version = "0.0.2", default-features = false }

[dev-dependencies]
pyre-jit-trace = { workspace = true, features = ["test-support"] }
pyre-object = { workspace = true }
pyre-interpreter = { workspace = true, features = ["host_env", "test-hooks"] }
pyre-module = { workspace = true, features = ["host_env"] }
