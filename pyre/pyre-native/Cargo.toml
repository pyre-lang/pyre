[package]
name = "pyre-native"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Native library backends for pyre, kept outside the LLBC extraction"

[features]
default = ["host_env"]
host_env = ["rustpython-host_env/native-certs"]
sandbox = ["host_env"]
wasm_vfs = ["dep:lz4_flex"]

[dependencies]
parking_lot = { workspace = true }
bitflags = { workspace = true }
rustpython-common = { workspace = true, features = ["hashlib"] }
sha1 = { workspace = true }
sha2 = { workspace = true }
# `ssl` is MemoryBIO/OID/ALPN. `rustls` is native-only.
rustpython-host_env = { workspace = true, features = ["ssl"] }
libc = { workspace = true }
lz4_flex = { version = "0.13", default-features = false, features = [
    "safe-decode",
], optional = true }

# Wasm stays on the base dependency and does not link libffi.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rustpython-host_env = { workspace = true, features = ["rustls"] }
rustls = { workspace = true }
rustls-webpki = { workspace = true }
rustls-pemfile = { workspace = true }
x509-parser = { workspace = true }
pem-rfc7468 = { workspace = true }
der = { workspace = true }
pkcs8 = { workspace = true }
rustls-native-certs = { workspace = true }

# `wmi` calls `crate::ctypes` with no feature gate, so a Windows build of
# host_env does not compile unless `ctypes` is on.
[target.'cfg(windows)'.dependencies]
rustpython-host_env = { workspace = true, features = ["ctypes"] }

[build-dependencies]
cc = "1.2"
lz4_flex = { version = "0.13", default-features = false, optional = true }
