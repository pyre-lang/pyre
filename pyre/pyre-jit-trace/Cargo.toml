[package]
name = "pyre-jit-trace"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Trace-time JIT for pyre — MIFrame and tracing logic"

[features]
default = ["dynasm", "prepass", "pyre-module"]
cranelift = ["dep:majit-backend-cranelift", "majit-metainterp/cranelift"]
dynasm = ["dep:majit-backend-dynasm", "majit-metainterp/dynasm"]
# The build script's translation prepass over the LLBC set, and with it the
# build-dependencies that prepass alone needs (a host copy of the interpreter
# stack, compiled at the build-override opt-level). Off, the script writes
# compile-only placeholders and refuses unless `MAJIT_LLBC_EXTRACTION=1`, so
# the only build that legitimately drops it is a Charon extraction pass of
# `pyre-jit` — which is exactly where the host copy was dead weight.
prepass = ["dep:pyre-interpreter", "dep:majit-translate", "dep:mimalloc", "dep:syn", "dep:walkdir", "dep:memmap2"]
# Keep JIT-side module references in lockstep with the interpreter's sandbox
# build, which drops the modules that reach the OS directly.
sandbox = ["pyre-interpreter/sandbox", "pyre-module?/sandbox"]
test-support = []

[dependencies]
parking_lot = { workspace = true }
bitflags = { workspace = true }
indexmap = { workspace = true }
pyre-object = { workspace = true }
pyre-interpreter = { workspace = true, features = ["host_env"] }
rustpython-wtf8 = { workspace = true }
linkme = { workspace = true }
majit-ir = { workspace = true }
majit-macros = { workspace = true }
majit-metainterp = { workspace = true }
majit-jitcode = { workspace = true }
majit-backend = { workspace = true }
majit-trace = { workspace = true }
majit-gc = { workspace = true }
majit-rlib = { workspace = true }
serde = { workspace = true, features = ["rc"] }
bincode = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
majit-backend-cranelift = { workspace = true, optional = true }
majit-backend-dynasm = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
ctor = { workspace = true }
# The wasm backend's exception helpers (jit_exc_raise) are needed on wasm32
# where the native backends are absent. default-features off: the host
# binding (web vs host-import) is selected upstream by pyre-jit, so pulling
# the `web` default here would unify it into a wasm-host build.
majit-backend-wasm = { path = "../../majit/majit-backend-wasm", version = "0.0.2", default-features = false }

[build-dependencies]
# `majit-ir` and `bincode` serve the placeholders too; the rest is `prepass`.
majit-ir = { workspace = true }
majit-translate = { workspace = true, optional = true }
mimalloc = { version = "0.1", optional = true }
memmap2 = { version = "0.9", optional = true }
pyre-interpreter = { workspace = true, features = ["host_env", "dynasm"], optional = true }
# Same process as `jit_trace_fnaddrs()`: without this crate the
# `#[pyre_methods]` wrappers that moved out of the interpreter never
# join `BUILTIN_WRAPPER_DESCRIPTORS`, and every hot call to those
# builtins takes the `no jitcode for address` residual. Its implicit
# feature is the translation's `usemodules`: only a build that links
# `pyre-module` translates `pyre-module.ullbc` with the core, so a build
# without it is unaffected by any `pyre-module` edit.
pyre-module = { workspace = true, optional = true, features = ["host_env"] }
serde = { workspace = true, features = ["rc"] }
serde_json = { workspace = true }
bincode = { workspace = true }
syn = { workspace = true, optional = true }
walkdir = { workspace = true, optional = true }

[dev-dependencies]
majit-ir = { workspace = true, features = ["test-support"] }
majit-translate = { workspace = true }
serde_json = { workspace = true }
majit-charon-reader = { workspace = true }
insta = { workspace = true }
# `#[test]`s here drive interpreter frames through `init_typeobjects` without
# compiling pyre-interpreter under `cfg(test)`; enable its `test-hooks` feature
# so the thread-local dict hash hook is installed on the test threads.
pyre-interpreter = { workspace = true, features = ["host_env", "test-hooks"] }
# `_random` lives in `pyre-module`, so the residual address its jitcodes call
# is published by that crate's optional-module hooks rather than by the
# interpreter's own table.
pyre-module = { workspace = true, features = ["host_env"] }
