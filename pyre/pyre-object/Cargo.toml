[package]
name = "pyre-object"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Python object model for pyre interpreter"

[features]
# Collect on every allocation. Forwarded so list/object rooting tests can run
# under the same gate as `pyre-jit`.
gc_stress = ["majit-gc/gc_stress"]
# Alloc-hook owner gate for unit tests. Empty so a normal build that does not
# name it compiles the production alloc path with no test branch. Interpreter
# tests enable it from `[dev-dependencies]` only.
test-hooks = []

[dependencies]
num-traits = { workspace = true }
majit-gc = { workspace = true }
majit-ir = { workspace = true }
majit-rlib = { workspace = true }
parking_lot = { workspace = true }
majit-macros = { workspace = true }
pyre-macros = { workspace = true }
indexmap = { workspace = true }
rustpython-wtf8 = { workspace = true }
linkme = { workspace = true }
bitflags = { workspace = true }
paste = { workspace = true }

# `type_object()` accessors publish their residual-call address through a
# `linkme` link section off wasm32.  wasm32 rejects that section — a custom
# `link_section` static there must be a plain byte list, and a descriptor
# holds two pointers — so the accessors register from a constructor instead.
[target.'cfg(target_arch = "wasm32")'.dependencies]
ctor = { workspace = true }
