[package]
name = "pyre-module"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Optional builtin modules for pyre interpreter"
# `ExternalCompilationInfo.link_extra`. Dependents read
# `DEP_PYRE_MINIMAL_CURSES_LINK_ARG_<n>`.
links = "pyre_minimal_curses"

[features]
default = ["host_env"]
host_env = [
    "pyre-interpreter/host_env",
    "dep:rustpython-host_env",
    "pyre-native/host_env",
]
sandbox = ["pyre-interpreter/sandbox", "pyre-native/sandbox"]
# The `gc.collect` drain of `_rawrefcount_perform` reads this feature from
# this crate, so the launcher forwards it here as well as to the interpreter.
cpyext = ["pyre-interpreter/cpyext"]
dynasm = ["pyre-interpreter/dynasm", "majit-metainterp/dynasm"]
cranelift = ["pyre-interpreter/cranelift", "majit-metainterp/cranelift"]

[dependencies]
pyre-object = { workspace = true }
pyre-interpreter = { workspace = true }
pyre-native = { workspace = true }
ctor = { workspace = true }
libc = { workspace = true }
linkme = { workspace = true }
bitflags = { workspace = true }
majit-ir = { workspace = true }
majit-jitcode = { workspace = true }
majit-macros = { workspace = true }
majit-metainterp = { workspace = true }
majit-rlib = { workspace = true }
majit-gc = { workspace = true }
num-traits = { workspace = true }
parking_lot = { workspace = true }
num-complex = { workspace = true }
paste = { workspace = true }
pymath = { workspace = true }
rustpython-common = { workspace = true }
rustpython-compiler = { workspace = true }
rustpython-compiler-core = { workspace = true }
rustpython-host_env = { workspace = true, optional = true }
rustpython-unicode = { workspace = true }
rustpython-wtf8 = { workspace = true }

[target.'cfg(windows)'.dependencies]
# `_ctypes`'s Windows-only helpers still come from host_env.
rustpython-host_env = { workspace = true, optional = true, features = ["ctypes"] }
# `faulthandler`'s vectored exception handler returns
# `EXCEPTION_CONTINUE_SEARCH`; `_cffi_backend.errorbox` shows its dialog
# from a `CreateThread` thread with `MessageBoxW`. Same 0.61 line as pyre-interpreter so
# HANDLE types stay one package instance.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_IO",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
# `_overlapped.CreateEvent` builds the `WideCString` name
# `rustpython_host_env::winapi::create_event_w` takes.
widestring = "1.2"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
pyre-interpreter = { workspace = true, features = ["test-hooks"] }
