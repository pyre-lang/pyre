[env]
# The full `eval_loop_jit` pipeline analysis (a ~100-arm `match
# instruction` dispatch) recurses deep enough to overflow the default
# 2 MiB thread stack used by the libtest harness.  `pyre-jit-trace/
# build.rs` already runs the identical analysis on an explicit 64 MiB
# worker for this reason; this raises every cargo-spawned test/binary
# thread's minimum stack so `cargo test` works without a manual
# `RUST_MIN_STACK=…` prefix.
RUST_MIN_STACK = "16777216"

# Export the linker-synthesized `__indirect_function_table` from wasm32
# builds. The JIT's `jit_call` trampoline resolves residual call targets by
# their wasm table index (a `fn as usize` is a table index on wasm32) and so
# needs the host to reach this table: the browser glue reads
# `wasm.__indirect_function_table` (`pyre-wasm/www/index.html`) and the native
# wasmtime runner reads the `__indirect_function_table` export. Without this
# flag the table stays module-internal and indirect residual calls cannot be
# dispatched.
# The wasm32 shadow stack (linear memory below the data segment) defaults to
# 1 MiB. The codewriter's `flatten.rs` `make_link` / `make_bytecode_block`
# recursion follows one link per block, so a long function's jitcode needs
# more; 8 MiB matches the native main-thread stack, as on Windows below.
[target.wasm32-unknown-unknown]
rustflags = ["-C", "link-arg=--export-table", "-C", "link-arg=-zstack-size=8388608"]

# The PE default main-thread reserve is 1 MiB. `RUST_MIN_STACK` only
# applies to threads Rust itself spawns, so a recursive CALL_ASSEMBLER
# chain that fits in Linux's 8 MiB main stack dies here with
# STATUS_STACK_BUFFER_OVERRUN (0xC0000409) and empty stderr.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "link-arg=/STACK:8388608"]
