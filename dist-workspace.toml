[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.31.0"
# CI backends to support
ci = "github"
# Trigger release workflow via workflow_dispatch so a wrapper can normalize repo-specific tags
dispatch-releases = true
# The generic shell/PowerShell installers only move classified binaries and
# discard archive data trees.  Pyre requires its stdlib beside the binary, so
# publish complete archives and the Homebrew formula until those installers
# support non-flat application layouts.
installers = ["homebrew"]
# A GitHub repo to push Homebrew formulas to
tap = "youknowone/homebrew-tap"
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Publish jobs to run in CI
publish-jobs = ["homebrew"]
# Whether to install an updater program
install-updater = false
# The release archive is a Python installation, not a standalone binary.
# `stage-stdlib.py` generates this directory immediately before `dist build`
# and it is included beside the executable in every archive and installer.
# `include` keeps each item's own name and has no per-target form, so the one
# entry names the stdlib directory on every platform: `lib` holding
# `pyre3.15t`, except on Windows where the stdlib is `Lib` itself and the two
# spellings are the same path.
include = ["dist-assets/lib"]
github-build-setup = "../pyre-dist-build-setup.yml"
# A prefix git tags must include for dist to care about them
tag-namespace = "release-pyre"
# Skip checking whether the specified configuration files are up to date
allow-dirty = ["ci"]
