[workspace.package]
version = "0.0.2"
edition = "2024"
license = "MIT"
repository = "https://github.com/youknowone/pyre"

[workspace]
resolver = "2"
default-members = ["pyre/pyrex"]
members = [
    # majit
    "majit/majit",
    "majit/majit-ir",
    "majit/majit-trace",
    "majit/majit-backend",
    "majit/majit-backend-cranelift",
    "majit/majit-backend-dynasm",
    "majit/majit-backend-wasm",
    "majit/majit-backend-wasm-host",
    "majit/majit-gc",
    "majit/majit-macros",
    "majit/majit-metainterp",
    "majit/majit-rlib",
    "majit/majit-translate",
    "majit/majit-jitcode",
    "majit/majit-config",
    "majit/majit-charon-reader",
    "majit/examples/tlr",
    "majit/examples/tl",
    "majit/examples/tla",
    "majit/examples/tiny2",
    "majit/examples/tiny3",
    "majit/examples/tinyframe",
    "majit/examples/braininterp",
    "majit/examples/dualtape",
    "majit/examples/tlc",
    "majit/examples/calc",
    "majit/examples/i64env",
    "majit/examples/cel",
    "majit/examples/spcount",
    "majit/examples/regex",
    # pyre
    "pyre/pyre-object",
    "pyre/pyre-macros",
    "pyre/pyre-native",
    "pyre/pyre-interpreter",
    "pyre/pyre-sandbox",
    "pyre/pyre-module",
    "pyre/pyre-jit",
    "pyre/pyre-jit-trace",
    "pyre/pyrex",
    "pyre/pyre-wasm",
    "pyre/pyre-wasm-test",
    "pyre/pyre-wasm-runner",
]

[workspace.dependencies]
# pyre internal crates
pyre-object = { version = "0.0.2", path = "pyre/pyre-object" }
pyre-macros = { version = "0.0.2", path = "pyre/pyre-macros" }
pyre-native = { version = "0.0.2", path = "pyre/pyre-native", default-features = false }
# Defaults off so a dependant can leave `full` out; each names `host_env`
# itself and forwards `full` through a feature of its own.
pyre-interpreter = { version = "0.0.2", path = "pyre/pyre-interpreter", default-features = false }
pyre-sandbox = { version = "0.0.2", path = "pyre/pyre-sandbox" }
# Defaults off so a core build can leave `full` unset. Each dependant names
# `host_env` and forwards `full`.
pyre-module = { version = "0.0.2", path = "pyre/pyre-module", default-features = false }
# Defaults off for the same reason as `pyre-interpreter`: `full` is forwarded.
pyre-jit = { version = "0.0.2", path = "pyre/pyre-jit", default-features = false }
# Defaults off so `pyre-jit` forwards `dynasm` / `cranelift` / `prepass` one by
# one and its LLBC extraction pass can leave `prepass` out (see that manifest).
pyre-jit-trace = { version = "0.0.2", path = "pyre/pyre-jit-trace", default-features = false }

# Pinned to upstream main after the pyre compatibility fixes from #8390 and
# #8506, the memoryview fixes from #8553, the runtime marshal code-byte hook
# from #8552, the `Constants` mutable-access impls from #8557, and the compiler
# parity fixes from #8550 and the posixsubprocess setgroups fix from #8609 were
# merged.  `fix_code_filenames` needs `IndexMut`
# to edit nested code constants in place, and `loads` relies on the #8552 hook
# to preserve invalid code bytes, so this pin must not move below either.
#
# Moved up again for the console read-boundary fix from #8621, and now also
# names `MarshalError::DataTooShort` / `EofObject` and `CFormatType::Bytes`,
# which arrived with it.
#
# Pinned to RustPython/RustPython main (ssl keylog #8655). CJK tables in
# rustpython-common are unchanged from #8631; the bump is the rest of the
# workspace crates that share this rev. `bz2` is the #8638 stream engine.
#
# Repinned through #8655: shared hashlib engine, POSIX helpers, and AppendLog.
# Then through #8664: compression::lzma compiles on every target, so `_lzma`
# needs no pyre-local wasm fallback.
# Repinned to RustPython/RustPython main (#8665/#8675/#8678 rustls,
# #8676 unicodedata name aliases and named sequences, #8680 host CA paths,
# #8687 remaining builtin text codecs plus localeconv_numeric / uuid /
# named-pipe get).
# Then through #8696: file identity, dll dirs, hard link, startfile,
# wide ExpandEnvironmentStrings, and =X: drive-cwd helpers.
# Then through #8700: crates.io rustpython-ruff_* 0.16.5, and #8161.
# Then through #8702 on RustPython/RustPython main (3191ecaf3): shared
# host_env thread/locale/loader/BSTR, rustls-free ssl core, wasm
# _ssl/_socket, Windows types, thread _NAME_MAXLEN, WASI rustls,
# parse-override ranking, and hang-at-finalize daemon handles.
# Then through #8727 on RustPython/RustPython main (c382a607): host_env
# `ssl` is rustls-free; `rustls` is the engine.
# Then through #8734 on RustPython/RustPython main (73a3f45ee):
# `nt::scandir` (`FindFirstFileW` / `FindNextFileW`).
# Then through #8736 on RustPython/RustPython main (a7c0500a4): remaining
# Windows socket and faulthandler constants.
# Then through #8742 on RustPython/RustPython main (013333e5f): Windows
# `if_nameindex` names as Wtf8Buf.
# Then through #8743 on RustPython/RustPython main (02c2a1dfc): remaining
# Windows `_socket` constants.
# Then through #8745 on RustPython/RustPython main (7d6612aab): remaining
# WinSock rffi integer names.
# Then through RustPython/RustPython #8757 wrap on #8745 (a70830b7d):
# remaining Win32 exception and file constants.
# Then through RustPython/RustPython #8760 wrap on that pin (b25e3a8c1):
# remaining ssl/posix/socket/locale/zlib/PROTO/access/reparse constants.
# Then through RustPython/RustPython #8766 wrap on current main (b91bffcec):
# ctypes FUNCFLAG/TYPEFLAG, BSD chflags, AT_FDCWD, SIG_DFL. malachite-bigint 0.12.
# Then through RustPython/RustPython #8782 (eb1546ae0): host_env posix::forkpty.
# Then through RustPython/RustPython #8779 (979ea4c4d): vsock/UDPLITE/SOL
# fallbacks, remaining BSD chflags, S_IFDOOR/PORT/WHT.
# Then through RustPython/RustPython #8790/#8792 on main (86c7fa20c):
# SIG*/ITIMER*, LC_*, F_*, _SC_/_PC_*, CLOCK_*, RLIMIT_*, EVFILT_* names.
# Then the 0.6.0 tag (b2626c56).
# Then youknowone/RustPython 68d51a971: b2626c56 plus RustPython/RustPython
# #9104 (BUILD_LIST_FROM_ARG behind CompileOpts::build_list_from_arg).
#
rustpython-common = { git = "https://github.com/youknowone/RustPython.git", rev = "68d51a97170390f8b564022e3f8f4729a0b10d7b", features = ["binascii", "bz2", "cjk-codecs", "inet", "json", "lzma", "zlib"] }
rustpython-literal = { git = "https://github.com/youknowone/RustPython.git", rev = "68d51a97170390f8b564022e3f8f4729a0b10d7b" }
rustpython-compiler = { git = "https://github.com/youknowone/RustPython.git", rev = "68d51a97170390f8b564022e3f8f4729a0b10d7b" }
rustpython-compiler-core = { git = "https://github.com/youknowone/RustPython.git", rev = "68d51a97170390f8b564022e3f8f4729a0b10d7b" }
ruff-text-size = { package = "rustpython-ruff_text_size", version = "0.16.5" }
num-complex = "0.4"
rustpython-host_env = { git = "https://github.com/youknowone/RustPython.git", rev = "68d51a97170390f8b564022e3f8f4729a0b10d7b" }
rustpython-wtf8 = { git = "https://github.com/youknowone/RustPython.git", rev = "68d51a97170390f8b564022e3f8f4729a0b10d7b" }
rustpython-unicode = { git = "https://github.com/youknowone/RustPython.git", rev = "68d51a97170390f8b564022e3f8f4729a0b10d7b" }
sre-engine = { package = "rustpython-sre_engine", git = "https://github.com/youknowone/RustPython.git", rev = "68d51a97170390f8b564022e3f8f4729a0b10d7b" }

# majit JIT framework
# Defaults off although that manifest declares none: backend selection there is
# mandatory, so a `default` added to it later would otherwise arrive through
# every inheriting edge at once instead of being named per consumer.
majit-metainterp = { version = "0.0.2", path = "majit/majit-metainterp", default-features = false }
majit-ir = { version = "0.0.2", path = "majit/majit-ir" }
majit-trace = { version = "0.0.2", path = "majit/majit-trace" }
majit-backend = { version = "0.0.2", path = "majit/majit-backend" }
majit-backend-cranelift = { version = "0.0.2", path = "majit/majit-backend-cranelift" }
majit-backend-dynasm = { version = "0.0.2", path = "majit/majit-backend-dynasm" }
majit-backend-wasm-host = { version = "0.0.2", path = "majit/majit-backend-wasm-host" }
majit-gc = { version = "0.0.2", path = "majit/majit-gc" }
majit-macros = { version = "0.0.2", path = "majit/majit-macros" }
majit-rlib = { version = "0.0.2", path = "majit/majit-rlib" }
majit-translate = { version = "0.0.2", path = "majit/majit-translate" }
majit-jitcode = { version = "0.0.2", path = "majit/majit-jitcode" }
majit-config = { version = "0.0.2", path = "majit/majit-config" }
majit-charon-reader = { version = "0.0.2", path = "majit/majit-charon-reader" }

# shared dependencies
parking_lot = "0.12"
malachite-bigint = "0.12"
num-traits = "0.2"
num-integer = "0.1"
bit-set = "0.10"
bitflags = "2"
vecset = "0.0.4"
vecmap_rs = { package = "vecmap-rs", version = "0.2.4", features = ["serde"] }
indexmap = { version = "2.14", features = ["serde"] }
paste = "1"

# serde
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
bincode = "1.3"

# proc-macro / codegen
syn = { version = "2", features = ["full", "visit"] }
quote = "1"
proc-macro2 = "1"

# data structures
smallvec = "1"
# link-section distributed slice: `#[pyre_class]` appends each type's GC
# descriptor to a whole-program slice the JIT driver checks for completeness.
linkme = "0.3"
ctor = "1"

# cranelift backend
cranelift-codegen = "0.134"
cranelift-frontend = "0.134"
cranelift-jit = "0.134"
cranelift-module = "0.134"
cranelift-native = "0.134"
target-lexicon = "0.13"
region = "3"

# dynasm backend
dynasm = "5"
dynasmrt = "5"

# wasm
wasm-encoder = { version = "0.245", default-features = false }
wasm-bindgen = "0.2"
wasmparser = "0.225"
# `wasm_js` is enabled only by `pyre-wasm`'s `web` feature (browser crypto via
# wasm-bindgen). The native-host `wasm-host` build instead selects getrandom's
# `custom` backend (`--cfg getrandom_backend="custom"`) so it carries no
# wasm-bindgen imports. Kept on the same 0.4 line as `rustpython-host_env` so
# the `web` build's `getrandom/wasm_js` feature reaches that shared instance.
getrandom = "0.4.2"
# Native host runtime for the wasm runner. Pinned to the wasmtime release whose
# `wasmtime-internal-*` support crates already ride along with cranelift 0.134
# (the version the dynasm/cranelift backends use), so it reuses the existing
# cranelift rather than duplicating it.
wasmtime = "47"

# system
libc = "0.2"
stacker = "0.1"

# string / hash
siphasher = "1.0"
thin-vec = "0.2.19"
rustc-hash = "2.1.3"
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"

# TLS backend (pyre-native only).  The interpreter sees opaque, non-inlined
# entry points so rustls and its crypto provider stay outside Charon/LLBC.
# `prefer-post-quantum` is named because defaults are off, and it is the only
# thing that puts X25519MLKEM768 first in `DEFAULT_KX_GROUPS` instead of last;
# `_ssl` installs that provider process-wide and hands the list to every
# handshake that does not call `set_ecdh_curve`, so last means a server
# supporting both picks the classical group every time. `logging` stays off:
# it only feeds the `log` crate, which nothing here consumes.
rustls = { version = "0.23.39", default-features = false, features = ["std", "tls12", "aws_lc_rs", "prefer-post-quantum"] }
rustls-webpki = { version = "0.103.5", default-features = false, features = ["alloc"] }
rustls-pemfile = "2.2"
x509-parser = "0.18"
pem-rfc7468 = { version = "1", features = ["alloc"] }
der = { version = "0.8", features = ["alloc", "pem"] }
pkcs8 = { version = "0.11", features = ["encryption", "pkcs5", "pem"] }
rustls-native-certs = "0.8"

# math.  The bigint arm stays off: `math.factorial` and its siblings are
# implemented here on `RBigInt`, so enabling it would only pull a second
# `malachite-bigint` major into the graph beside the one the compiler
# constants use.
pymath = "0.2.0"

# cli
lexopt = "0.3"
dirs = "6"
rustyline = "17"

# dev / build
tempfile = "3"
walkdir = "2"
insta = "1"

# xz-core 0.1.0-rc.0 as published carries two defects.
#
# It files its `lzma12_optmap` static initializer in the MSVC `.CRT$XIB`
# group.  `_initterm_e` walks that table as `int (__cdecl *)(void)` and
# `__scrt_common_main_seh` returns 255 when an entry reports non-zero, but the
# initializer's Rust signature returns `()`, so nothing defines the value that
# is read: every pyre invocation on windows-latest exited 255 with empty stdout
# and stderr.
#
# And `alone_decoder.rs` validates a picky LZMA-alone dictionary size by
# smearing `dict_size - 1` down and then adding 1 back.  When the smear
# saturates to `0xFFFF_FFFF` -- `dict_size == 0` is the reachable case -- that
# `+ 1` overflows.  The C it ports from wraps, and so does a release build, but
# a debug build panics "attempt to add with overflow" and takes the whole
# process down: `test.test_tarfile` dies before its first Lzma test on a debug
# `pyre`, identically with the JIT on and off.  Release CI never sees it.
#
# simnalamburt/xz-rs#21 fixes both -- the option map is now a compile-time
# constant, so there is no runtime initializer to place, and the add is
# spelled wrapping -- and is merged, so the pin follows upstream main until a
# release carrying it reaches crates.io.
[patch.crates-io]
xz-core = { git = "https://github.com/simnalamburt/xz-rs", rev = "5bf95411d0307e052ca2aeb06f0d75565c9a7362" }

# `cargo run --release` is the benchmark/developer performance surface too.
# Give it the same cross-crate optimization used by distributable binaries;
# codegen-units=1 additionally lets LLVM optimize the interpreter's large
# dispatch/call graph as one unit instead of preserving parallel-CGU barriers.
[profile.dev]
# Line tables instead of full DWARF. Panic backtraces keep their file and line
# numbers, which is what every crash report in this project is read from; what
# goes away is the variable and type description a debugger would use to print
# locals. Full debuginfo costs both link time and a great deal of disk: one
# worktree's `target/debug/deps` measured 50 GB, and a machine hosting a dozen
# worktrees of this workspace carries that a dozen times over.
#
# `debug-assertions` is a separate setting and is untouched, so every
# `debug_assert!` and every `cfg(debug_assertions)` arm still compiles in.
# The LLBC extraction is the one dev-profile build that turns it off, because
# the image it produces describes the release interpreter the JIT accompanies
# (`scripts/llbc_extract.py`, `CARGO_PROFILE_DEV_DEBUG_ASSERTIONS`).
#
# For a debugger session, ask for it on the command line instead of editing
# this: `CARGO_PROFILE_DEV_DEBUG=2 cargo build`.
debug = "line-tables-only"

# The LLBC artefacts the `majit-translate` integration tests read are large --
# `pyre-interpreter.ullbc` alone is around 800 MB of JSON -- and at the dev
# profile's `opt-level = 0` the two passes `Llbc::from_slice` makes over those
# bytes dominate the whole `cargo test` run: six of the 166 test binaries spend
# 211s of its 268s of test time. Optimizing the three crates that do that work
# leaves the tests themselves unoptimized, so a failing assertion still reports
# from line-table debuginfo with `debug_assertions` on.
#
# Measured over the same 166 binaries: those six go 211s -> 42s and the whole
# run 268s -> 97s. The compile side barely moves -- a clean `cargo build -p
# majit-translate --tests` measured 92s at `opt-level = 0`, 87s at 1 and 104s
# at 2, because the front end rather than codegen is what that crate spends its
# build on.
[profile.dev.package.serde_json]
opt-level = 2
[profile.dev.package.majit-charon-reader]
opt-level = 2
[profile.dev.package.majit-translate]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

# The core edit-build loop (`pyre/scripts/build-jit-core.sh`). Same
# optimisation level as `release`, but no cross-crate LTO and parallel,
# incremental codegen: the release link of `pyre-dynasm` alone (thin LTO,
# one codegen unit) takes over three minutes per interpreter edit. The
# product binaries and every gate stay on `release`.
[profile.jit-core]
inherits = "release"
lto = "off"
codegen-units = 16
incremental = true

# The `pyre-jit-trace` build script runs the whole RPython-style translation
# pipeline (flowspace → annotator → rtyper → codewriter) over the interpreter.
# Cargo's default build-override profile compiles it at `opt-level = 0`, so that
# analysis — the single longest and most memory-hungry step of a cold build —
# runs unoptimized.
[profile.release.build-override]
opt-level = 1

# The translator crates that analysis spends its time in are built at full
# optimisation even as build dependencies; a named package outranks
# `build-override`. Measured on the pinned LLBC set: 7.52e11 -> 6.34e11
# instructions retired for one prepass run.
[profile.release.package.majit-translate]
opt-level = 3
[profile.release.package.majit-charon-reader]
opt-level = 3
[profile.release.package.serde_json]
opt-level = 3

[profile.dev.build-override]
opt-level = 1
