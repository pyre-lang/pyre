[package]
name = "majit-rlib"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "RPython rlib runtime support library"

[features]
host_env = []
sandbox = ["host_env"]

[dependencies]
indexmap = { workspace = true }
linkme = { workspace = true }
parking_lot = { workspace = true }
majit-gc = { workspace = true }
majit-ir = { workspace = true }
majit-jitcode = { workspace = true }
majit-macros = { workspace = true }
num-traits = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
libc = { workspace = true }

# `libffi = { version = "5", features = ["system"] }` maps `system` onto
# `libffi-sys/system`. libffi-sys finds/links the system libffi (or builds
# the bundled copy on MSVC); clibffi's ECI therefore has no `libraries`.
[target.'cfg(any(unix, windows))'.dependencies]
libffi-sys = { version = "4.2.0", features = ["system"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
ctor = { workspace = true }

[dev-dependencies]
malachite-bigint = { workspace = true }

[build-dependencies]
cc = "1.2"
