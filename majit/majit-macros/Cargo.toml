[package]
name = "majit-macros"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Proc macros for majit JIT integration"

[lib]
proc-macro = true

[features]
cranelift = ["majit-metainterp/cranelift"]
dynasm = ["majit-metainterp/dynasm"]

[dependencies]
syn = { workspace = true, features = ["visit", "visit-mut", "extra-traits"] }
quote = { workspace = true }
proc-macro2 = { workspace = true }
majit-jitcode = { workspace = true }

[dev-dependencies]
linkme = { workspace = true }
majit-gc = { workspace = true }
majit-ir = { workspace = true }
majit-metainterp = { workspace = true }
majit-rlib = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
ctor = { workspace = true }
