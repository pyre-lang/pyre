[package]
name = "majit-metainterp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Meta-interpreter and optimizer for majit JIT compiler"

[features]
# Backend selection is mandatory and intentionally has no default.
dynasm = ["dep:majit-backend-dynasm"]
cranelift = ["dep:majit-backend-cranelift"]
# Per-thread allocator box. `install_jitframe_gc` calls `set_gc_allocator`,
# which panics in `note_gc_box_installed` unless this is on. A process-global
# runtime uses `install_active_backend_gc_standalone` and leaves this off.
gc_box = ["majit-gc/gc_box"]
jit-audits = ["majit-ir/jit-audits"]
# A measurement arm, never a shipping one. It adds run-time selectable
# amplification loops to three stages of the warm compiled entry in
# `jitdriver::JitDriver::back_edge_internal`, so what one stage costs
# against another is a difference taken inside ONE binary. Off by default,
# and a build without it has neither the loops nor the atomic load that
# selects them. See `jitdriver::BackEdgeStageRepeats`, which also says which
# stages CANNOT be amplified and are therefore left in the residual.
__back-edge-stage-probe = []
# The second half of the same split, and never a shipping feature either. It
# amplifies the two repeatable stages of `execute_assembler_at_dispatch_key`
# and clocks the one that cannot repeat, and forwards to the cranelift arm
# that repeats the frame build. See `pyjitpl::ExecuteStageRepeats`, which
# says which numbers are amplified and which is single-shot.
__execute-stage-probe = ["majit-backend-cranelift?/__execute-stage-probe"]
# The third of the same family, for the sibling-door yield scan an embedder
# runs ahead of a warm entry. That scan's predicate is a conjunction over three
# state sources, and the public API fuses two of them: `has_compiled_loop` is
# `entry_procedure_token(..).is_some()`, and `get_procedure_token` performs the
# `Weak::upgrade` AND reads `is_invalidated` inside one function. This feature
# adds the one reader that separates them -- the cell lookup and the upgrade
# with NO flag read after it -- so an amplified arm can price the refcount pair
# on its own. See `WarmState::probe_cell_token_upgrades`.
__yield-stage-probe = []

[dependencies]
bitflags = { workspace = true }
linkme = { workspace = true }
parking_lot = { workspace = true }
majit-ir = { workspace = true }
majit-trace = { workspace = true }
majit-backend = { workspace = true }
majit-gc = { workspace = true }
majit-rlib = { workspace = true }
majit-jitcode = { workspace = true }
majit-config = { workspace = true }
majit-macros = { workspace = true }
bit-set = { workspace = true }
smallvec = { workspace = true }
vecset = { workspace = true }
indexmap = { workspace = true }
rustc-hash = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Native backends never build for wasm32; on wasm32 the backend is
# selected by target_arch (majit-backend-wasm). Gating both here keeps a
# stray `dynasm`/`cranelift` feature (e.g. leaking through a default) from
# pulling a native-only crate into a wasm32 build.
majit-backend-cranelift = { workspace = true, optional = true }
majit-backend-dynasm = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
ctor = { workspace = true }
# Specified directly (not via workspace inheritance) so default-features can
# be turned off. The host binding (web vs host-import) is chosen explicitly
# upstream through pyre-jit's `wasm-web` / `wasm-host` features; pulling the
# `web` default here would unify `web` into a `host-import` build and route
# `glue.rs` through wasm-bindgen instead of the plain wasm imports.
majit-backend-wasm = { path = "../majit-backend-wasm", version = "0.0.2", default-features = false }

[dev-dependencies]
majit-translate = { workspace = true }
bincode = { workspace = true }
majit-macros = { workspace = true }
# `install_jitframe_gc` is behind `gc_box`. This edge turns that feature on
# for this package's tests only; it is not a default, and a downstream
# runtime build does not gain the per-thread box.
majit-metainterp = { workspace = true, features = ["gc_box"] }
# Integration tests name `majit_gc` directly (`store_singleton`,
# `gc_box_installed`). Dev-only, same as the feature above.
majit-gc = { workspace = true, features = ["gc_box"] }
smallvec = { workspace = true }

# A counting `#[global_allocator]` is process-wide, so this target must own its
# process: libtest's default runner is multi-threaded and a second test running
# beside it would land its allocations in the same counter. `--test-threads=1`
# cannot be spelled in a manifest, so `harness = false` is the only way to get
# a single owned `main`.
[[test]]
name = "allocs_per_compiled_entry"
path = "tests/allocs_per_compiled_entry.rs"
harness = false
