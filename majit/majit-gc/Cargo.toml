[package]
name = "majit-gc"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Garbage collector for majit JIT runtime"

[features]
# Deterministic GC stress mode. Compiles in a per-instance `stress_collect`
# flag (off by default; opt in with `MiniMarkGC::set_stress_collect(true)` or
# the `MAJIT_GC_STRESS` env var) that forces a full collection at the start of
# every `alloc_with_type`. This is the deterministic equivalent of running with
# a minimal `PYPY_GC_NURSERY`: it exposes any live object not reachable from a
# registered root or custom-trace path by moving/sweeping it on the next
# allocation rather than letting it survive by luck. Test-only; the default and
# release builds compile neither the field nor the branch, so production
# allocation cost is unchanged. Because the flag is per-instance, enabling the
# feature workspace-wide leaves suites that assert `minor_collections == 0`
# untouched — only an opted-in GC stresses its own allocations.
gc_stress = []

# Blackhole-object probe. Records every old-generation block and panics with a
# violation report when it finds invalid nursery references. The
# wasm32-unknown-unknown guest has no process environment, so it cannot read
# the `MAJIT_GC_BH_PROBE` env var and needs this compile-time gate instead. Off
# by default so ordinary wasm builds do not abort.
bh_probe = []

# Per-thread GC box. `install_gc_box` stores a caller-supplied `GcAllocator` in
# a backend thread-local and every allocation, write-barrier and heap query
# checks for it first. The process-global language runtime goes through
# `install_gc_standalone`; this alternative serves tests and embedders whose
# complete managed heap is execution-context-local and never crosses threads.
# Without this feature `gc_box_installed()` is a constant `false` and the
# backends' box branches fold away. A crate using `set_gc_allocator` must
# enable it; installing a box without it panics rather than silently routing
# operations to another heap.
gc_box = []

[dependencies]
bitflags = { workspace = true }
indexmap = { workspace = true }
rustc-hash = { workspace = true }
libc = { workspace = true }
majit-ir = { workspace = true }
majit-macros = { workspace = true }
parking_lot = { workspace = true }

# `#[dont_look_inside]` emits a wasm32 constructor that registers the residual
# trampoline (`emit_helper_fnaddr_ctor`).
[target.'cfg(target_arch = "wasm32")'.dependencies]
ctor = { workspace = true }

# `llarena.arena_protect` is posix `mprotect` and nt `VirtualProtect`;
# `llarena.has_protect` is false everywhere else, which is why this is not a
# dependency of the wasm32 build.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
region = { workspace = true }

[dev-dependencies]
majit-ir = { workspace = true, features = ["test-support"] }
